name: Secret & PII scan

# The layer that cannot be skipped with --no-verify.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan all tracked files
        run: python3 .github/secret-scan.py --tracked

      - name: Scan full history
        run: python3 .github/secret-scan.py --history
